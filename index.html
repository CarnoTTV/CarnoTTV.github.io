<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarnoTTV</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#050505;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */

body::before{
content:'';
position:fixed;
inset:0;
background:url('background.png') center center/cover no-repeat;
z-index:-2;
}

body::after{
content:'';
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:-1;
}

/* NAVBAR */

nav{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:90%;
max-width:1400px;

display:flex;
justify-content:space-between;
align-items:center;

padding:18px 35px;

background:rgba(0,0,0,.45);
backdrop-filter:blur(15px);

border-radius:18px;
border:1px solid rgba(255,255,255,.08);

z-index:1000;
}

.logo{
font-size:2rem;
font-weight:800;
}

.logo span{
color:#ff2d55;
}

/* LINKS */

.menu{
display:flex;
gap:30px;
}

.menu a{
text-decoration:none;
color:white;
font-weight:600;
transition:.3s;
}

.menu a:hover{
color:#ff2d55;
text-shadow:0 0 12px #ff2d55;
}

/* BUTTONS */

.btn{
display:inline-flex;
align-items:center;
justify-content:center;

padding:16px 34px;
border-radius:15px;

font-weight:700;
text-decoration:none;

transition:.3s;
}

.btn:hover{
transform:translateY(-4px) scale(1.05);
}

.btn-red{
background:#ff2d55;
box-shadow:0 0 20px rgba(255,45,85,.55);
color:white;
}

.btn-dark{
border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.04);
color:white;
}

/* HERO */

.hero{
min-height:100vh;
display:flex;
align-items:center;
padding:140px 8% 60px;
}

.hero-left{
max-width:700px;
}

.hero h2{
font-size:3rem;
font-weight:600;
}

.hero h1{
font-size:7rem;
line-height:1;
font-weight:800;
margin-bottom:20px;
}

.hero h1 span{
color:#ff2d55;
}

.hero p{
font-size:1.2rem;
line-height:1.8;
color:#ddd;
margin-bottom:35px;
}

/* GLASS PANELS */

.panel{
background:rgba(0,0,0,.45);
backdrop-filter:blur(14px);

border-radius:22px;
border:1px solid rgba(255,255,255,.08);

padding:28px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;

width:90%;
max-width:1400px;
margin:auto;
}

/* CARDS */

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:25px;
}

.card{
background:rgba(255,255,255,.03);

border:1px solid rgba(255,255,255,.08);
border-radius:16px;

padding:22px;

text-decoration:none;
color:white;

transition:.3s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:
0 0 25px rgba(255,45,85,.5);
}

/* FEATURED VIDEOS */

.video-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
margin-top:25px;
}

.video{
overflow:hidden;
border-radius:16px;
text-decoration:none;
color:white;
background:rgba(255,255,255,.03);
transition:.3s;
}

.video:hover{
transform:scale(1.03);
box-shadow:0 0 25px rgba(255,45,85,.5);
}

.video img{
width:100%;
display:block;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;

width:90%;
max-width:1400px;
margin:30px auto;
}

.stat{
text-align:center;
padding:30px;
}

/* COMMUNITY */

.community{
width:90%;
max-width:1400px;
margin:auto;
}

.community-box{
display:flex;
justify-content:space-between;
align-items:center;
gap:30px;
}

/* FOOTER */

footer{
padding:30px;
text-align:center;
margin-top:50px;
}

</style>
</head>
<body>

<!-- NAV -->

<nav>

<div class="logo">
Carno<span>TTV</span>
</div>

<div class="menu">
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#content">Content</a>
<a href="#stats">Stats</a>
<a href="#contact">Contact</a>
</div>

<div class="menu">
<a href="https://youtube.com/@CarnoTTV8" target="_blank">YouTube</a>
<a href="https://discord.gg/carnottv" target="_blank">Discord</a>
</div>

</nav>

<!-- HERO -->

<section class="hero" id="home">

<div class="hero-left">

<h2>Welcome to</h2>

<h1>
Carno<span>TTV</span>
</h1>

<p>
The Isle Evrima gameplay, Carnotaurus hunts,
PvP battles, survival guides and livestream adventures.
</p>

<a class="btn btn-red"
href="https://youtube.com/@CarnoTTV8"
target="_blank">
Subscribe Now
</a>

<a class="btn btn-dark"
href="#about">
Learn More
</a>

</div>

</section>

<!-- ABOUT + FEATURED -->
<!-- Gaming / Tutorials / Live Streams -->
<!-- Featured videos -->

<!-- STATS -->
<!-- COMMUNITY -->
<!-- FOOTER -->

</body>
</html>
