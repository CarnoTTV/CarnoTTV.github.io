<!DOCTYPE html>
<html lang="en">
<head>

<title>CarnoTTV</title>

<style>

body{

}

.wrapper{

    width:100%;
    max-width:1536px;
    margin:auto;
}

.wrapper img{
    width:100%;
    display:block;
}

/* TOP MENU */

.hotspot{
    position:absolute;

}

/* Home */
.home{
    top:1.2%;
    left:39%;
    width:4%;
    height:2.5%;
}

/* About */
.about{
    top:1.2%;
    left:44%;
    width:5%;
    height:2.5%;
}

/* Content */
.content{
    top:1.2%;
    left:50%;
    width:6%;
    height:2.5%;
}

/* Stats */
.stats{
    top:1.2%;
    left:56%;
    width:4%;
    height:2.5%;
}

/* Contact */
.contact{
    top:1.2%;
    left:61%;
    width:6%;
    height:2.5%;
}

/* YouTube button */
.youtube{
    top:34%;
    left:19%;
    width:15%;
    height:4%;
}

/* Learn More button */
.learn{
    top:34%;
    left:35%;
    width:11%;
    height:4%;
}

/* Subscribe Now bottom card */
.subscribe{
    top:82%;
    left:60%;
    width:14%;
    height:4%;
}
</style>
</head>
<body>

<div class="wrapper">

<img src="background.png" alt="CarnoTTV">

<a class="hotspot home" href="#"></a>
<a class="hotspot about" href="#about"></a>
<a class="hotspot content" href="#content"></a>
<a class="hotspot stats" href="#stats"></a>
<a class="hotspot contact" href="#contact"></a>

<a class="hotspot youtube"
href="https://youtube.com/@YOURCHANNEL"
target="_blank"></a>

<a class="hotspot learn"
href="#about"></a>

<a class="hotspot subscribe"
href="https://youtube.com/@YOURCHANNEL"
target="_blank"></a>

</div>

</body>
</html>
